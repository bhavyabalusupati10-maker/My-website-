<!DOCTYPE html>
<html>
<head>
<title>Registration & Login</title>
<style>
body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;padding:20px}
.card{background:white;padding:25px;border-radius:10px;width:320px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
h2{text-align:center;color:#333}
label{display:block;margin:10px 0 5px;font-weight:bold}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px}
input:focus{border-color:#1877f2;outline:none;box-shadow:0 0 5px #1877f2}
input:invalid{border-color:red}
button{width:100%;padding:10px;margin-top:15px;background:#1877f2;color:white;border:none;border-radius:5px;cursor:pointer}
.error{color:red;font-size:12px}
a{font-size:13px;display:block;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h2>Register</h2>
<form>
<label for="name">Full Name</label>
<input type="text" id="name" required>
<label for="email">Email</label>
<input type="email" id="email" required>
<label for="pass">Password</label>
<input type="password" id="pass" required minlength="6">
<label for="cpass">Confirm Password</label>
<input type="password" id="cpass" required>
<button type="submit">Create Account</button>
<a href="#login">Already have account? Login</a>
<a href="#forgot">Forgot Password?</a>
</form>

<h2 id="login" style="margin-top:30px">Login</h2>
<form>
<label for="lemail">Email</label>
<input type="email" id="lemail" required>
<label for="lpass">Password</label>
<input type="password" id="lpass" required>
<button type="submit">Login</button>
</form>
</div>
</body>
</html>
