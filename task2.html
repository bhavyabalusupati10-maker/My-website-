<!DOCTYPE html>
<html>
<head>

<style>
body{font-family:Arial;
background:#f4f5f7;
margin:0;

}
h1{text-align:center}
.board{display:grid;
grid-template-columns:re
eat(3,1fr);

.column{background:#ebecf0;

.task{background:white;

}
.priority{font-size:12px;
padding:2px 6px;
border-radius:3px;

}
.high{background:red}.
med{background:orange}.
low{background:green}
.progress{height:6px;
background:#ddd;
border-radius:3px;

}
.bar{height:100%;

}
.team{margin-top:5px;

}
@media(max-width:700px){.board{grid-template-columns:1fr}}

</head>
