
<!DOCTYPE html>
<html>
<head>
<title>Bhavya - Text Formatting</title>
</head>
<body>
<h1>HTML Text Formatting Tags</h1>

<p><b>Bold with b tag</b></p>
<p><strong>Strong - Important</strong></p>
<p><i>Italic with i tag</i></p>
<p><em>Emphasis text</em></p>
<p><u>Underlined text</u></p>
<p><mark>Highlighted text</mark></p>
<p><small>Small text</small></p>
<p><del>Deleted Rs.1000</del> <ins>New Rs.500</ins></p>
<p>H<sub>2</sub>O and a<sup>2</sup>+b<sup>2</sup></p>
<p><b><i><u>Bold Italic Underline Combined</u></i></b></p>

</body>
</html>
